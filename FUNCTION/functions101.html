      const numbers = [2, 3, 4, 5, 7];

      function printSum(num) {
        let x = 0;
        for (let i = 0; i < num.length; i++) {
          x = x + num[i];
        }
        return x;
      }  // 0+2,2+3,5+4,9+5,14+7  // 21

      function batmanVsuperman(n) {
        if (n % 2 === 0) return "Batman";
        else return "Superman";
      }

      const superhero = batmanVsuperman(printSum(numbers));

      document.write("My favorite superhero is " + superhero);
