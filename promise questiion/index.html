<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let min=1000
        let max=3000
        function random(){
            return Math.floor(Math.random()*(max-min)+min) 
        }


        function delay(time){
            return new Promise((resolve, reject) => {
             setTimeout(()=>{
                resolve()
             },time)
            })
        }



    async function sequentiaialdelaycounting(limit=5){
            let getrandom =random()
            for(let i=0;i<=limit;i++){
                console.log(`waiting ${random()} ms before logging ${i}`);
              await delay(getrandom)
                console.log(i)
      }
    }

      sequentiaialdelaycounting(6)
  


    </script>
</body>
</html>
