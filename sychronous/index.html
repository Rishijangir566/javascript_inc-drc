<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronous</title>
</head>
<body>
    
    <script>
        // synchronous programming------
       console.log("hello1")
       console.log("hello2")
       console.log("hello3")
       console.log("hello4")

    //    asynchrnous programming-------

      
    console.log("hello1")
       console.log("hello2")
       setTimeout(()=>{
           console.log("hello3")
       },2000)
       console.log("hello4")


    </script>
</body>
</html>
