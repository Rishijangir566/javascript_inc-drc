<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronous</title>
</head>
<body>
    
    <script>
        // synchronous programming------
       console.log("hello1") // print 1
       console.log("hello2")  // print 2
       console.log("hello3")   // print3
       console.log("hello4")  // print 4

    //    asynchrnous programming-------

      
    console.log("hello1") // pprint 1
       console.log("hello2") // print 2
       setTimeout(()=>{
           console.log("hello3") // print 4
       },2000)
       console.log("hello4") // print 3


    </script>
</body>
</html>
