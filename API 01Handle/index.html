<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API handle</title>
    <style>
        div img{
            height: 200px;
            width: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div style="text-align: center;">
        <h1>API handle</h1>
    </div>
    

    <script>
         let main =document.querySelector("div")
        let url ="https://dog.ceo/api/breeds/image/random"

        fetch(url)
        .then((response)=>{
           return response.json()
        })
        .then((result)=>{
            // console.log(result.message)
           pass(result) 
        }).catch((error)=>{
            console.log("Error")
        })



        function pass(res){
            let img=document.createElement("img")
               img.src=`${res.message}`
              main.append(img)
        }
        

    </script>
</body>
</html>
