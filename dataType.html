<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Data Type</title>
</head>
<body>


    <script>
     
let a = 34;
console.log(a)
console.log(typeof(a)) // Number 
let b = true;
console.log(b)  
console.log(typeof(b)) // bullean
let c = "rishi"
console.log(c)
console.log(typeof(c)) // string
let d ;
console.log(d)
console.log(typeof(d)) // undefined
let e = [23,34,56,55]
console.log(e)
console.log(typeof(e))  // object (array)
let f = {
    myname:"rishi",
    fName:"mukesh",
    class:17
}
console.log(f)
console.log(typeof(f)) // object
  
let g = NaN
console.log(g)
console.log(typeof(g)) // object not a number

let sym = Symbol("unique"); // symble
let bigNumber = 1234567890123456789012345678901234567890n;  // biggent


    </script>
    
</body>
